<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>독서 기록장 - 학생용</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* 전체 배경 및 기본 글꼴 – 대시보드와 통일 */
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      margin: 0;
      padding: 24px 16px 40px;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fbff 100%);
      color: #111827;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 22px 20px 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      border: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0 0 4px;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(90deg, #4a6cf7, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 18px;
    }

    /* 섹션 제목 */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #4b5563;
      margin: 16px 0 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-title span.icon {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #e0e7ff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #4f46e5;
    }

    /* 입력 그룹 공통 */
    .field-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 4px;
    }

    input[type="number"],
    input[type="text"],
    textarea {
      width: 100%;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      padding: 9px 11px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
      background-color: #f9fafb;
    }

    input:focus,
    textarea:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.12);
      background-color: #ffffff;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    /* 버튼 스타일 */
    .button {
      width: 100%;
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    }
    .button-primary {
      background: linear-gradient(90deg, #4f46e5, #6366f1);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
      margin-top: 6px;
    }
    .button-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 7px 16px rgba(79, 70, 229, 0.55);
    }
    .button-secondary {
      background: #eef2ff;
      color: #4f46e5;
      box-shadow: 0 2px 6px rgba(148, 163, 184, 0.4);
      margin-top: 8px;
    }
    .button-secondary:hover {
      background: #e0e7ff;
      transform: translateY(-1px);
    }

    .button:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    /* 로그인 전/후 안내 메시지 */
    .message {
      margin-top: 8px;
      font-size: 12px;
      color: #6b7280;
      min-height: 18px;
    }
    .message.error {
      color: #b91c1c;
    }
    .message.success {
      color: #15803d;
    }

    /* 학생 정보 카드 */
    .info-card {
      margin-top: 10px;
      padding: 10px 11px;
      border-radius: 14px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      font-size: 12.5px;
      color: #374151;
    }
    .info-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .info-name {
      font-weight: 700;
    }
    .info-tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4f46e5;
    }
    .info-book {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .info-pages {
      font-size: 12px;
      color: #4b5563;
    }

    /* 진행률 바 – 대시보드 스타일과 유사하게 */
    .progress-box {
      margin-top: 10px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .progress-bg {
      width: 100%;
      height: 9px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4f46e5, #22c55e);
      transition: width 0.4s ease;
    }

    .badge-done {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #dcfce7;
      color: #15803d;
      font-size: 11px;
      font-weight: 600;
      margin-left: 4px;
    }

    /* 푸터 안내 */
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      margin-top: 14px;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 10px 30px;
      }
      .container {
        padding: 18px 16px 20px;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>독서 기록장</h1>
    <div class="subtitle">번호만 입력하면 나만의 독서 기록장이 열려요 📚</div>

    <!-- 1. 로그인(번호 확인) 영역 -->
    <div class="section-title">
      <span class="icon">①</span>
      <span>번호 입력</span>
    </div>

    <div class="field-group">
      <label for="numberInput">출석번호</label>
      <input
        type="number"
        id="numberInput"
        min="1"
        placeholder="예: 7"
      />
    </div>

    <button id="loginBtn" class="button button-secondary">
      나의 독서 기록 불러오기
    </button>

    <div id="loginMessage" class="message"></div>

    <!-- 2. 로그인 후 보이는 학생 정보/진행률 -->
    <div id="studentInfo" style="display:none;">
      <div class="info-card">
        <div class="info-top">
          <div class="info-name" id="studentName"></div>
          <div class="info-tag">내 책 정보</div>
        </div>
        <div class="info-book" id="bookTitle"></div>
        <div class="info-pages" id="pageInfo"></div>

        <div class="progress-box">
          <div class="progress-label">
            <span>진행률</span>
            <span id="percentText">0%</span>
          </div>
          <div class="progress-bg">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </div>

      <!-- 3. 오늘 읽은 내용 기록 -->
      <div class="section-title">
        <span class="icon">②</span>
        <span>오늘 읽은 내용 기록하기</span>
      </div>

      <div class="field-group">
        <label for="readPageInput">오늘 읽은 페이지 수</label>
        <input
          type="number"
          id="readPageInput"
          min="1"
          placeholder="예: 15"
        />
      </div>

      <div class="field-group">
        <label for="feelingInput">오늘의 한줄소감</label>
        <textarea
          id="feelingInput"
          placeholder="오늘 읽으면서 느낀 점을 한 줄로 적어보세요."
        ></textarea>
      </div>

      <div class="field-group">
        <label for="sentenceInput">인상깊었던 문장</label>
        <textarea
          id="sentenceInput"
          placeholder="책에서 기억에 남는 문장을 그대로 옮겨 적어보세요."
        ></textarea>
      </div>

      <button id="submitBtn" class="button button-primary">
        오늘 읽은 내용 제출하기
      </button>

      <div id="submitMessage" class="message"></div>
    </div>

    <div class="footer-note">
      저장이 잘 안 되면 선생님께 바로 알려주세요 🙂
    </div>
  </div>

  <script>
    // ★ Apps Script 웹앱 URL을 여기에 넣어 주세요.
    const API_URL = 'https://script.google.com/macros/s/AKfycbzbQgWdJHOqe23Fp54Db0p_IAwTR_hLJz7KrtZs2vrhr72m-vk_D5KSWYy1es3ErK0/exec';

    const numberInput = document.getElementById('numberInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginMessage = document.getElementById('loginMessage');

    const studentInfoBox = document.getElementById('studentInfo');
    const studentNameEl = document.getElementById('studentName');
    const bookTitleEl = document.getElementById('bookTitle');
    const pageInfoEl = document.getElementById('pageInfo');
    const percentTextEl = document.getElementById('percentText');
    const progressFillEl = document.getElementById('progressFill');

    const readPageInput = document.getElementById('readPageInput');
    const feelingInput = document.getElementById('feelingInput');
    const sentenceInput = document.getElementById('sentenceInput');
    const submitBtn = document.getElementById('submitBtn');
    const submitMessage = document.getElementById('submitMessage');

    // 현재 로그인한 학생 정보 저장용
    let currentStudent = null;

    /**
     * 진행률(%) 계산 함수
     */
    function calcPercent(readPage, totalPage) {
      if (!totalPage || totalPage <= 0) return 0;
      const p = Math.round((readPage / totalPage) * 100);
      return Math.max(0, Math.min(100, p));
    }

    /**
     * 카드 영역에 학생 정보/진행률 표시
     */
    function renderStudentInfo(data) {
      const total = Number(data.totalPage) || 0;
      const read = Number(data.readPage) || 0;
      const percent = calcPercent(read, total);

      studentNameEl.textContent = `${data.number}번 ${data.name}`;
      bookTitleEl.textContent = data.book || '배정된 책 정보가 없습니다.';
      pageInfoEl.textContent = total
        ? `전체 ${total}쪽 중 지금까지 ${read}쪽 읽었어요.`
        : `전체 쪽수 정보가 아직 입력되지 않았어요.`;

      percentTextEl.textContent = `${percent}%`;
      progressFillEl.style.width = `${percent}%`;

      // 완독 뱃지 표시 여부
      if (percent === 100 || data.isDone === '완독') {
        if (!document.querySelector('.badge-done')) {
          const badge = document.createElement('span');
          badge.className = 'badge-done';
          badge.textContent = '완독 축하 🎉';
          percentTextEl.parentElement.appendChild(badge);
        }
      }
    }

    /**
     * 1) 번호로 로그인(학생 정보 불러오기)
     */
    loginBtn.addEventListener('click', async () => {
      const num = numberInput.value.trim();
      loginMessage.textContent = '';
      loginMessage.className = 'message';

      if (!num) {
        loginMessage.textContent = '출석번호를 먼저 입력해 주세요.';
        loginMessage.classList.add('error');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '불러오는 중...';

      try {
        const res = await fetch(`${API_URL}?action=login&number=${encodeURIComponent(num)}`);
        const json = await res.json();

        if (!json.success) {
          loginMessage.textContent = json.message || '번호를 다시 확인해 주세요.';
          loginMessage.classList.add('error');
          studentInfoBox.style.display = 'none';
          currentStudent = null;
        } else {
          currentStudent = json;
          loginMessage.textContent = '내 독서 기록을 불러왔어요.';
          loginMessage.classList.add('success');
          studentInfoBox.style.display = 'block';
          renderStudentInfo(json);
        }
      } catch (err) {
        console.error(err);
        loginMessage.textContent = '서버와 연결하는 중 오류가 발생했어요.';
        loginMessage.classList.add('error');
        studentInfoBox.style.display = 'none';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '나의 독서 기록 불러오기';
      }
    });

    /**
     * 2) 오늘 읽은 내용 제출
     */
    submitBtn.addEventListener('click', async () => {
      submitMessage.textContent = '';
      submitMessage.className = 'message';

      if (!currentStudent) {
        submitMessage.textContent = '먼저 번호를 입력해서 로그인해 주세요.';
        submitMessage.classList.add('error');
        return;
      }

      const readPage = readPageInput.value.trim();
      const feeling = feelingInput.value.trim();
      const sentence = sentenceInput.value.trim();

      if (!readPage || Number(readPage) <= 0) {
        submitMessage.textContent = '오늘 읽은 페이지 수를 적어 주세요.';
        submitMessage.classList.add('error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '제출 중...';

      try {
        const body = {
          action: 'updateProgress',
          number: currentStudent.number,
          name: currentStudent.name,
          readPage: readPage,
          feeling: feeling,
          impressiveSentence: sentence
        };

        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const json = await res.json();

        if (!json.success) {
          submitMessage.textContent = json.message || '저장에 실패했어요. 다시 시도해 주세요.';
          submitMessage.classList.add('error');
          return;
        }

        submitMessage.textContent = '오늘 읽은 내용이 저장되었어요!';
        submitMessage.classList.add('success');

        // 입력칸 비우기
        readPageInput.value = '';
        feelingInput.value = '';
        sentenceInput.value = '';

        // 최신 진행률 다시 조회해서 갱신
        const refreshRes = await fetch(
          `${API_URL}?action=getProgress&number=${encodeURIComponent(currentStudent.number)}`
        );
        const refreshJson = await refreshRes.json();
        if (refreshJson.success) {
          currentStudent = refreshJson;
          renderStudentInfo(refreshJson);
        }
      } catch (err) {
        console.error(err);
        submitMessage.textContent = '서버와 연결하는 중 오류가 발생했어요.';
        submitMessage.classList.add('error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '오늘 읽은 내용 제출하기';
      }
    });

    // 엔터키로 로그인 편의
    numberInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        loginBtn.click();
      }
    });
  </script>
</body>
</html>
