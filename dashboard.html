<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>독서 기록장 - 대시보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --bg: #f3f4ff;
      --card: #ffffff;
      --border: #e5e7eb;
      --text-main: #111827;
      --text-sub: #6b7280;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      margin: 0;
      padding: 20px 12px 40px;
      background: radial-gradient(circle at top left, #e0e7ff 0, #f9fafb 45%, #eef2ff 100%);
      color: var(--text-main);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, #4a6cf7, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 18px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 11px;
      color: var(--primary);
      background: #e0e7ff;
      padding: 2px 8px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .refresh-btn {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffffaa;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .refresh-btn:hover {
      background: #f3f4ff;
    }

    .summary-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-card {
      background: var(--card);
      border-radius: 16px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .summary-label {
      font-size: 11px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .summary-value {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .summary-sub {
      font-size: 11px;
      color: #9ca3af;
    }

    .summary-icon {
      font-size: 15px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 10px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sort-group {
      display: inline-flex;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffffaa;
      overflow: hidden;
    }

    .sort-btn {
      padding: 4px 10px;
      font-size: 11px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--text-sub);
      white-space: nowrap;
    }

    .sort-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 600;
    }

    .legend {
      font-size: 11px;
      color: #9ca3af;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 10px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, #4f46e5, #22c55e);
    }

    .table-card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead {
      background: #f9fafb;
    }

    th, td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }

    th {
      font-size: 11px;
      color: #6b7280;
      font-weight: 600;
      white-space: nowrap;
    }

    tbody tr:nth-child(even) {
      background: #fcfcff;
    }

    .number-cell {
      font-weight: 700;
      color: #4b5563;
      white-space: nowrap;
    }

    .name-cell {
      font-weight: 600;
    }

    .book-cell {
      color: #6b7280;
      max-width: 220px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .progress-cell {
      min-width: 130px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4f46e5, #22c55e);
      transition: width 0.3s ease;
    }

    .percent-text {
      font-size: 11px;
      color: #4b5563;
      margin-bottom: 2px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      white-space: nowrap;
    }

    .status-done {
      background: #dcfce7;
      color: #15803d;
    }

    .status-reading {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status-none {
      background: #f9fafb;
      color: #9ca3af;
    }

    .mascot-cell {
      text-align: center;
      font-size: 18px;
    }

    .streak-cell {
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
    }

    .streak-hot {
      color: #f97316;
      font-weight: 600;
    }

    .date-cell {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
    }

    .empty {
      padding: 20px;
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
    }

    .error-msg {
      margin-top: 10px;
      font-size: 12px;
      color: #b91c1c;
    }

    @media (max-width: 720px) {
      th:nth-child(4), td:nth-child(4) { display: none; } /* 책 제목 숨김 */
      th:nth-child(8), td:nth-child(8) { display: none; } /* 마지막 기록일 숨김 */
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>독서 기록장 대시보드</h1>
    <div class="subtitle">
      Progress 시트 기준으로 학생들의 진행 상황과 스트릭 현황을 한눈에 볼 수 있는 화면입니다.
    </div>

    <div class="top-bar">
      <div class="tag">
        📚 <span>마지막 읽은 페이지 & 당일 수정 기준</span>
      </div>
      <button id="refreshBtn" class="refresh-btn">
        🔄 새로고침
      </button>
    </div>

    <div class="summary-row">
      <div class="summary-card">
        <div class="summary-label">
          <span class="summary-icon">✅</span>
          완독한 학생 수
        </div>
        <div class="summary-value">
          <span id="doneCount">0</span><span>명</span>
        </div>
        <div class="summary-sub" id="doneRateText">전체 0명 중 0%</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">
          <span class="summary-icon">📈</span>
          평균 진행률
        </div>
        <div class="summary-value">
          <span id="avgPercent">0</span><span>%</span>
        </div>
        <div class="summary-sub" id="avgPageText">평균 0쪽 읽음</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">
          <span class="summary-icon">🔥</span>
          오늘 기록한 학생 수
        </div>
        <div class="summary-value">
          <span id="todayWriters">0</span><span>명</span>
        </div>
        <div class="summary-sub" id="streakInfoText">연속 기록 0일 이상 0명</div>
      </div>
    </div>

    <div class="controls">
      <div class="sort-group">
        <button class="sort-btn active" data-key="number">번호순</button>
        <button class="sort-btn" data-key="name">이름순</button>
        <button class="sort-btn" data-key="percent">진행률순</button>
        <button class="sort-btn" data-key="streak">스트릭순</button>
      </div>
      <div class="legend">
        <span><span class="legend-dot"></span> 진행률 (누적/전체쪽수)</span>
        <span>👑 완독 / 🦅 높은 진행률 / 🐣~🐔 성장 단계</span>
      </div>
    </div>

    <div class="table-card" id="tableWrapper">
      <div class="empty" id="loadingMsg">데이터를 불러오는 중입니다…</div>
      <table id="dataTable" style="display:none;">
        <thead>
          <tr>
            <th>번호</th>
            <th>이름</th>
            <th>책 제목</th>
            <th>진행률</th>
            <th>상태</th>
            <th>캐릭터</th>
            <th>스트릭</th>
            <th>마지막 기록</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div id="errorMessage" class="error-msg"></div>
  </div>

  <script>
    // index.html에서 사용 중인 것과 "동일한" 웹앱 URL을 넣으세요.
    const API_URL = '여기에_웹앱_URL_붙여넣기';

    const MASCOT_STAGES = [
      { min: 0,   emoji: '🥚', label: '알' },
      { min: 1,   emoji: '🐣', label: '부화 시작' },
      { min: 15,  emoji: '🐤', label: '아기 병아리' },
      { min: 35,  emoji: '🐥', label: '병아리' },
      { min: 60,  emoji: '🐔', label: '어른 닭' },
      { min: 85,  emoji: '🦅', label: '독서 독수리' },
      { min: 100, emoji: '👑', label: '완독 왕' }
    ];

    const $ = (id) => document.getElementById(id);

    const refreshBtn = $('refreshBtn');
    const loadingMsg = $('loadingMsg');
    const table = $('dataTable');
    const tableBody = $('tableBody');
    const errorMessage = $('errorMessage');

    const doneCountEl = $('doneCount');
    const doneRateTextEl = $('doneRateText');
    const avgPercentEl = $('avgPercent');
    const avgPageTextEl = $('avgPageText');
    const todayWritersEl = $('todayWriters');
    const streakInfoTextEl = $('streakInfoText');

    const sortButtons = document.querySelectorAll('.sort-btn');
    let currentSortKey = 'number';
    let dataList = [];

    function calcPercent(read, total) {
      if (!total || total <= 0) return 0;
      return Math.max(0, Math.min(100, Math.round((read / total) * 100)));
    }

    function getMascot(percent) {
      let idx = 0;
      MASCOT_STAGES.forEach((s, i) => {
        if (percent >= s.min) idx = i;
      });
      return MASCOT_STAGES[idx];
    }

    function formatDate(dateValue) {
      if (!dateValue) return '-';
      try {
        const d = new Date(dateValue);
        if (isNaN(d.getTime())) return String(dateValue);
        const y = d.getFullYear();
        const m = ('0' + (d.getMonth() + 1)).slice(-2);
        const day = ('0' + d.getDate()).slice(-2);
        return `${y}-${m}-${day}`;
      } catch (e) {
        return String(dateValue);
      }
    }

    function buildRow(obj) {
      const total = Number(obj.totalPage) || 0;
      const read = Number(obj.readPage) || 0;
      const percent = calcPercent(read, total);
      const mascot = getMascot(percent);

      const tr = document.createElement('tr');

      const tdNum = document.createElement('td');
      tdNum.className = 'number-cell';
      tdNum.textContent = obj.number;
      tr.appendChild(tdNum);

      const tdName = document.createElement('td');
      tdName.className = 'name-cell';
      tdName.textContent = obj.name;
      tr.appendChild(tdName);

      const tdBook = document.createElement('td');
      tdBook.className = 'book-cell';
      tdBook.textContent = obj.book || '-';
      tr.appendChild(tdBook);

      const tdProgress = document.createElement('td');
      tdProgress.className = 'progress-cell';
      const percentText = document.createElement('div');
      percentText.className = 'percent-text';
      percentText.textContent = total
        ? `${percent}% · ${read}/${total}쪽`
        : `${read}쪽 (전체쪽수 미입력)`;
      const barBg = document.createElement('div');
      barBg.className = 'progress-bar-bg';
      const barFill = document.createElement('div');
      barFill.className = 'progress-bar-fill';
      barFill.style.width = `${percent}%`;
      barBg.appendChild(barFill);
      tdProgress.appendChild(percentText);
      tdProgress.appendChild(barBg);
      tr.appendChild(tdProgress);

      const tdStatus = document.createElement('td');
      const spanStatus = document.createElement('span');
      if (obj.isDone === '완독' || percent === 100) {
        spanStatus.className = 'status-pill status-done';
        spanStatus.textContent = '완독';
      } else if (read > 0) {
        spanStatus.className = 'status-pill status-reading';
        spanStatus.textContent = '읽는 중';
      } else {
        spanStatus.className = 'status-pill status-none';
        spanStatus.textContent = '시작 전';
      }
      tdStatus.appendChild(spanStatus);
      tr.appendChild(tdStatus);

      const tdMascot = document.createElement('td');
      tdMascot.className = 'mascot-cell';
      tdMascot.textContent = mascot.emoji;
      tr.appendChild(tdMascot);

      const tdStreak = document.createElement('td');
      tdStreak.className = 'streak-cell';
      const streak = Number(obj.streak) || 0;
      const todayCount = Number(obj.todayCount) || 0;
      if (streak > 0) {
        tdStreak.innerHTML =
          `<span class="${streak >= 3 ? 'streak-hot' : ''}">연속 ${streak}일</span>` +
          (todayCount > 0 ? ` · 오늘 ${todayCount}번` : '');
      } else {
        tdStreak.textContent = '아직 스트릭 없음';
      }
      tr.appendChild(tdStreak);

      const tdDate = document.createElement('td');
      tdDate.className = 'date-cell';
      tdDate.textContent = formatDate(obj.lastDate);
      tr.appendChild(tdDate);

      return tr;
    }

    function updateSummary(list) {
      if (!list.length) {
        doneCountEl.textContent = '0';
        doneRateTextEl.textContent = '전체 0명 중 0%';
        avgPercentEl.textContent = '0';
        avgPageTextEl.textContent = '평균 0쪽 읽음';
        todayWritersEl.textContent = '0';
        streakInfoTextEl.textContent = '연속 기록 0일 이상 0명';
        return;
      }

      const totalStudents = list.length;
      const done = list.filter(
        (s) => s.isDone === '완독' || calcPercent(Number(s.readPage) || 0, Number(s.totalPage) || 0) === 100
      ).length;
      const doneRate = Math.round((done / totalStudents) * 100);

      let sumPercent = 0;
      let sumRead = 0;
      let sumTotal = 0;
      let todayWriters = 0;
      const today = new Date();
      const todayStr = formatDate(today);

      const hotStreakers = list.filter((s) => Number(s.streak) >= 3).length;

      list.forEach((s) => {
        const total = Number(s.totalPage) || 0;
        const read = Number(s.readPage) || 0;
        sumRead += read;
        sumTotal += total;
        sumPercent += calcPercent(read, total);
        if (Number(s.todayCount) > 0 && formatDate(s.lastDate) === todayStr) {
          todayWriters += 1;
        }
      });

      const avgPercent = Math.round(sumPercent / totalStudents);
      const avgRead = Math.round(sumRead / totalStudents);

      doneCountEl.textContent = done;
      doneRateTextEl.textContent = `전체 ${totalStudents}명 중 ${doneRate}%`;
      avgPercentEl.textContent = isNaN(avgPercent) ? 0 : avgPercent;
      avgPageTextEl.textContent = `평균 ${isNaN(avgRead) ? 0 : avgRead}쪽 읽음`;
      todayWritersEl.textContent = todayWriters;
      streakInfoTextEl.textContent = `연속 3일 이상 기록 중인 학생 ${hotStreakers}명`;
    }

    function renderTable() {
      tableBody.innerHTML = '';
      if (!dataList.length) {
        table.style.display = 'none';
        loadingMsg.style.display = 'block';
        loadingMsg.textContent = '표시할 데이터가 없습니다.';
        return;
      }
      loadingMsg.style.display = 'none';
      table.style.display = 'table';

      dataList.forEach((item) => {
        tableBody.appendChild(buildRow(item));
      });
    }

    function sortData(key) {
      currentSortKey = key;
      sortButtons.forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.key === key);
      });

      dataList.sort((a, b) => {
        if (key === 'number') {
          return Number(a.number) - Number(b.number);
        }
        if (key === 'name') {
          return String(a.name).localeCompare(String(b.name), 'ko');
        }
        if (key === 'percent') {
          const pa = calcPercent(Number(a.readPage) || 0, Number(a.totalPage) || 0);
          const pb = calcPercent(Number(b.readPage) || 0, Number(b.totalPage) || 0);
          return pb - pa;
        }
        if (key === 'streak') {
          return (Number(b.streak) || 0) - (Number(a.streak) || 0);
        }
        return 0;
      });

      renderTable();
    }

    async function loadData() {
      errorMessage.textContent = '';
      loadingMsg.style.display = 'block';
      loadingMsg.textContent = '데이터를 불러오는 중입니다…';
      table.style.display = 'none';

      try {
        const res = await fetch(`${API_URL}?action=getAll`);
        const json = await res.json();
        if (!json.success) {
          throw new Error(json.message || '데이터를 불러오지 못했습니다.');
        }
        dataList = json.list || [];
        updateSummary(dataList);
        sortData(currentSortKey);
      } catch (err) {
        console.error(err);
        errorMessage.textContent =
          '데이터를 불러오는 중 오류가 발생했습니다. Apps Script 웹앱 URL과 배포 상태를 한 번 확인해 주세요.';
        loadingMsg.textContent = '데이터를 불러올 수 없습니다.';
      }
    }

    refreshBtn.addEventListener('click', loadData);
    sortButtons.forEach((btn) =>
      btn.addEventListener('click', () => sortData(btn.dataset.key))
    );

    // 최초 로딩
    loadData();
  </script>
</body>
</html>
